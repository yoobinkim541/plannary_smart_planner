name: E-class Sync

on:
  # Safety net only — the primary 5-minute sync runs on the self-hosted Ubuntu worker
  # (see worker/README.md). This cron just covers worker outages.
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger E-class sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ECLASS_SYNC_URL: ${{ vars.ECLASS_SYNC_URL }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo '::error::Configure the CRON_SECRET repository secret to match the deployed sync service.'
            exit 1
          fi
          if [ -z "$ECLASS_SYNC_URL" ]; then
            echo '::error::Configure the ECLASS_SYNC_URL repository variable with the deployed /api/eclass/sync endpoint.'
            exit 1
          fi
          curl --fail --show-error --silent \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$ECLASS_SYNC_URL"
